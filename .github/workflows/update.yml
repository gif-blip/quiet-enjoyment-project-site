name: Refresh data and rebuild site

# Every Monday at 13:10 UTC (~6-7 a.m. Boulder), and on demand from the Actions
# tab ("Run workflow") — useful during the September peak.
#
# Cadence note: the underlying city feed updates daily, and these runs are free,
# so weekly keeps charts and enforcement figures current. The published watch
# list is deliberately slower — update.py anchors it to complete calendar
# months, so an address near the threshold cannot flicker on and off between
# runs. Data freshness and naming stability are decoupled on purpose.
on:
  schedule:
    - cron: '10 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh open data, archive monthly snapshot, recompute analysis
        run: python3 pipeline/update.py

      - name: Rebuild every page
        run: python3 pipeline/build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name  "Quiet Enjoyment Project bot"
          git config user.email "yourneighbor@quietenjoymentproject.org"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Weekly refresh: $(date -u +%Y-%m-%d)"
          git push
