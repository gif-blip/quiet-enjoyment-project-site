name: Refresh data and rebuild site

# 2nd of each month, 13:10 UTC (~6-7 a.m. Boulder). Also runnable on demand
# from the Actions tab via "Run workflow".
on:
  schedule:
    - cron: '10 13 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh open data, archive monthly snapshot, recompute analysis
        run: python3 pipeline/update.py

      - name: Rebuild every page
        run: python3 pipeline/build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name  "Quiet Enjoyment Project bot"
          git config user.email "yourneighbor@quietenjoymentproject.org"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Monthly refresh: $(date -u +%Y-%m-%d)"
          git push
